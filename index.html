<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Application Tracker — Cloud</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#00e05a;--green-dark:#00b347;--ink:#0a0a0a;--paper:#f4f1e8;--white:#ffffff;
    --shadow:6px 6px 0 var(--ink);--shadow-sm:3px 3px 0 var(--ink);
    --pending:#ffd23f;--sent:#4ea8ff;--interview:#b388ff;--offer:#00e05a;--rejected:#ff5c5c;--dropped:#bdbdbd;
  }
  .mail-sync-chip{display:inline-flex;align-items:center;gap:6px;font-family:'Unbounded',sans-serif;
    font-size:11px;font-weight:600;padding:8px 14px;border:2.5px solid var(--ink);background:var(--white);
    box-shadow:2px 2px 0 var(--ink);white-space:nowrap;cursor:default;}
  .mail-sync-chip .dot{width:8px;height:8px;border-radius:50%;background:#bbb;flex-shrink:0;}
  .mail-sync-chip.active .dot{background:var(--green-dark);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Space Grotesk',sans-serif;background:var(--paper);color:var(--ink);padding:32px 24px 80px;
    background-image:radial-gradient(var(--ink) 1px,transparent 1px);background-size:26px 26px;background-position:-13px -13px;min-height:100vh;}
  .wrap{max-width:1280px;margin:0 auto;}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:20px;margin-bottom:28px;}
  h1{font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(28px,5vw,52px);line-height:.95;letter-spacing:-1px;}
  h1 .blip{color:var(--green-dark);}
  .sub{font-size:14px;font-weight:500;margin-top:8px;opacity:.7;max-width:460px;}
  .btn{font-family:'Unbounded',sans-serif;font-weight:600;font-size:14px;background:var(--green);color:var(--ink);
    border:3px solid var(--ink);padding:14px 22px;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .08s,box-shadow .08s;white-space:nowrap;}
  .btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  .btn.ghost{background:var(--white);}
  .btn.sm{padding:8px 14px;font-size:12px;box-shadow:2px 2px 0 var(--ink);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm);}

  .banner{border:3px solid var(--ink);padding:14px 18px;margin-bottom:24px;box-shadow:var(--shadow-sm);font-size:14px;font-weight:500;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .banner.warn{background:var(--pending);}
  .banner.err{background:var(--rejected);}
  .banner.ok{background:#c8f7d4;}
  .banner code{background:rgba(0,0,0,.08);padding:2px 6px;font-family:monospace;font-size:12px;word-break:break-all;}
  .banner input{flex:1;min-width:240px;font-family:monospace;font-size:12px;padding:8px 10px;border:2px solid var(--ink);}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:28px;}
  .stat{background:var(--white);border:3px solid var(--ink);padding:18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
  .stat .num{font-family:'Unbounded',sans-serif;font-weight:800;font-size:40px;line-height:1;}
  .stat .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:6px;}
  .stat .bar{position:absolute;bottom:0;left:0;height:6px;width:100%;}

  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px;}
  .search{flex:1;min-width:200px;font-family:'Space Grotesk';font-size:15px;padding:12px 16px;border:3px solid var(--ink);background:var(--white);box-shadow:var(--shadow-sm);}
  .search:focus{outline:none;box-shadow:5px 5px 0 var(--green-dark);}
  select{font-family:'Space Grotesk';font-weight:600;font-size:14px;padding:12px 16px;border:3px solid var(--ink);background:var(--white);box-shadow:var(--shadow-sm);cursor:pointer;}

  .tablewrap{border:3px solid var(--ink);background:var(--white);box-shadow:var(--shadow);overflow-x:auto;position:relative;}
  table{width:100%;border-collapse:collapse;min-width:980px;}
  th{font-family:'Unbounded',sans-serif;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;text-align:left;
    padding:14px 12px;background:var(--ink);color:var(--paper);position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap;}
  th:hover{background:var(--green-dark);color:var(--ink);}
  th .arrow{opacity:.4;font-size:10px;}
  td{padding:12px;border-bottom:2px solid #eee;font-size:14px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.row:hover td{background:#fbfbf5;}
  .pos{font-weight:700;}
  .co{font-weight:500;opacity:.85;}
  .muted{opacity:.4;font-style:italic;}
  .badge{display:inline-block;font-family:'Unbounded',sans-serif;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:5px 10px;border:2px solid var(--ink);white-space:nowrap;}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;border:1.5px solid var(--ink);background:#f0f0f0;white-space:nowrap;}
  .pill.yes{background:#c8f7d4;} .pill.no{background:#ffd6d6;} .pill.tbd{background:#eee;opacity:.7;}
  .rowbtns{display:flex;gap:6px;}
  .iconbtn{border:2px solid var(--ink);background:var(--white);cursor:pointer;padding:5px 9px;font-size:13px;box-shadow:1px 1px 0 var(--ink);}
  .iconbtn:hover{background:var(--green);}
  .iconbtn.del:hover{background:var(--rejected);}
  .empty{text-align:center;padding:60px 20px;font-family:'Unbounded';font-weight:600;opacity:.5;}
  .loadingbar{position:absolute;top:0;left:0;height:4px;background:var(--green-dark);width:0;transition:width .3s;z-index:5;}

  .overlay{position:fixed;inset:0;background:rgba(10,10,10,.6);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto;}
  .overlay.on{display:flex;}
  .modal{background:var(--paper);border:3px solid var(--ink);box-shadow:var(--shadow);width:100%;max-width:680px;padding:28px;}
  .modal h2{font-family:'Unbounded';font-weight:800;font-size:24px;margin-bottom:20px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .field input,.field select{font-family:'Space Grotesk';font-size:14px;padding:10px 12px;border:2.5px solid var(--ink);background:var(--white);}
  .field input:focus,.field select:focus{outline:none;box-shadow:3px 3px 0 var(--green-dark);}
  .modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px;}
  footer{margin-top:36px;font-size:12px;opacity:.55;text-align:center;}
  @media(max-width:600px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Application<span class="blip">.</span><br>Tracker</h1>
      <p class="sub">Synced to your Google Sheet. View and edit from any browser.</p>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <div class="mail-sync-chip" id="mailSyncChip" title="Email auto-sync status">
        <span class="dot"></span><span id="mailSyncLabel">Mail Sync</span>
      </div>
      <button class="btn ghost sm" id="refreshBtn">↻ Refresh</button>
      <button class="btn ghost sm" id="exportBtn">⬇ Export CSV</button>
      <button class="btn" id="addBtn">+ Add Application</button>
    </div>
  </header>

  <div id="setupBanner" class="banner warn" style="display:none;">
    <strong>Connect your Sheet:</strong>
    <span>Paste your Apps Script Web App URL here, then press Save.</span>
    <input id="urlInput" placeholder="https://script.google.com/macros/s/..../exec">
    <button class="btn sm" id="urlSave">Save URL</button>
  </div>
  <div id="statusBanner" class="banner ok" style="display:none;"></div>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <input class="search" id="search" placeholder="Search position, company, location…">
    <select id="statusFilter">
      <option value="">All statuses</option>
      <option value="pending">Pending</option><option value="sent">Sent</option>
      <option value="interview">Interview</option><option value="offer">Offer</option>
      <option value="rejected">Rejected</option><option value="dropped">Dropped</option>
    </select>
  </div>

  <div class="tablewrap">
    <div class="loadingbar" id="loadbar"></div>
    <table><thead><tr id="headRow"></tr></thead><tbody id="tbody"></tbody></table>
  </div>

  <footer>Click a column header to sort · ✎ edit · ✕ delete · Total: <span id="footCount">0</span> · <span id="syncNote"></span> · <span id="mailSyncNote"></span></footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Add Application</h2>
    <div class="grid">
      <div class="field"><label>Status</label>
        <select id="f_status">
          <option value="pending">Pending</option><option value="sent">Sent</option>
          <option value="interview">Interview</option><option value="offer">Offer</option>
          <option value="rejected">Rejected</option><option value="dropped">Dropped</option>
        </select></div>
      <div class="field"><label>Position</label><input id="f_position" placeholder="UX Designer"></div>
      <div class="field"><label>Company</label><input id="f_company" placeholder="Company name"></div>
      <div class="field"><label>Industry</label><input id="f_industry" placeholder="e.g. Advertising"></div>
      <div class="field"><label>Job Type</label>
        <select id="f_jobtype">
          <option value="">—</option><option>Full-time</option><option>Intern</option>
          <option>Apprenticeship</option><option>Contract</option><option>Part-time</option><option>TBD</option>
        </select></div>
      <div class="field"><label>Role</label><input id="f_role" placeholder="e.g. UX Researcher"></div>
      <div class="field"><label>OPT Accepted</label><input id="f_opt" placeholder="Yes / No / TBD"></div>
      <div class="field"><label>H1B Sponsor</label><input id="f_h1b" placeholder="Yes / No / TBD"></div>
      <div class="field"><label>Location</label><input id="f_location" placeholder="Remote / City"></div>
      <div class="field"><label>Date Posted</label><input id="f_posted" type="date"></div>
      <div class="field"><label>Date Applied</label><input id="f_applied" type="date"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <button class="btn" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────
// Paste your Apps Script Web App URL between the quotes, OR leave blank
// and enter it in the banner at the top (it's remembered in this browser).
let API_URL = "";
// ────────────────────────────────────────────────────────

const URLKEY='jobtracker.apiurl';
const COLS=[
  {k:'status',label:'Status'},{k:'position',label:'Position'},{k:'company',label:'Company'},
  {k:'industry',label:'Industry'},{k:'jobtype',label:'Type'},{k:'role',label:'Role'},
  {k:'opt',label:'OPT'},{k:'h1b',label:'H1B'},{k:'location',label:'Location'},
  {k:'posted',label:'Posted'},{k:'applied',label:'Applied'}
];
const FIELDS=['status','position','company','industry','jobtype','role','opt','h1b','location','posted','applied'];
const STATUS_COLORS={pending:'var(--pending)',sent:'var(--sent)',interview:'var(--interview)',offer:'var(--offer)',rejected:'var(--rejected)',dropped:'var(--dropped)'};

let data=[], sortKey='applied', sortDir=-1, editId=null, busy=false, emailSyncMeta=null;

if(!API_URL){const s=localStorage.getItem(URLKEY);if(s)API_URL=s;}

function pillClass(v){if(!v||/tbd|—/i.test(v))return 'tbd';if(/^yes|likely|✓/i.test(v))return 'yes';if(/^no\b/i.test(v))return 'no';return '';}
function fmtDate(d){
  if(!d)return '';
  const s=String(d).trim();
  let dt;
  // YYYY-MM-DD: construct as local date to avoid UTC-shift
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){const p=s.slice(0,10).split('-');dt=new Date(+p[0],+p[1]-1,+p[2]);}
  else dt=new Date(s);
  return isNaN(dt)?s:dt.toDateString();
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function setBar(p){document.getElementById('loadbar').style.width=p+'%';}
function showStatus(msg,kind){const b=document.getElementById('statusBanner');b.textContent=msg;b.className='banner '+(kind||'ok');b.style.display=msg?'flex':'none';}

async function api(action,payload){
  if(!API_URL)throw new Error('No API URL set');
  if(action==='get'){
    const r=await fetch(API_URL,{method:'GET'});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'GET failed');
    return j.rows;
  }
  // writes: no-cors means we can't read the response, so we re-fetch after.
  await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({action},payload))});
  return null;
}

async function loadData(){
  if(!API_URL){document.getElementById('setupBanner').style.display='flex';render();return;}
  document.getElementById('setupBanner').style.display='none';
  setBar(30);showStatus('Loading from your Sheet…','ok');
  try{
    const allRows=await api('get');
    // Separate the internal email-sync status row from real records
    emailSyncMeta = allRows.find(r=>r.id==='__email_sync_status__') || null;
    data = allRows.filter(r=>r.id!=='__email_sync_status__');
    setBar(100);showStatus('','ok');
    document.getElementById('syncNote').textContent='synced to Google Sheets';
    updateMailSyncChip();
  }catch(err){
    showStatus('Could not reach the Sheet: '+err.message+'  — check the URL and that the deployment is set to "Anyone".','err');
    document.getElementById('setupBanner').style.display='flex';
  }finally{setTimeout(()=>setBar(0),400);render();}
}

function updateMailSyncChip(){
  const chip=document.getElementById('mailSyncChip');
  const label=document.getElementById('mailSyncLabel');
  const note=document.getElementById('mailSyncNote');
  if(!emailSyncMeta){
    chip.classList.remove('active');
    label.textContent='Mail Sync';
    note.textContent='';
    return;
  }
  const dateVal=emailSyncMeta.position; // YYYY-MM-DD date stored in position field
  let dateStr='';
  if(dateVal){
    // Parse as local date (append T00:00 to avoid UTC-offset shifting the day)
    const d=new Date(dateVal+'T00:00');
    dateStr=d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  }
  chip.classList.add('active');
  label.textContent=`Mail Sync · ${dateStr}`;
  chip.title=`Last email sync: ${dateVal||'unknown'}\n${emailSyncMeta.company||''}`;
  note.textContent=`email sync: ${dateStr}`;
}

function renderStats(){
  const c={pending:0,sent:0,interview:0,offer:0,rejected:0,dropped:0};
  data.forEach(d=>{if(c[d.status]!==undefined)c[d.status]++;});
  const cards=[{n:data.length,l:'Total',col:'var(--ink)'},{n:c.sent,l:'Sent',col:'var(--sent)'},
    {n:c.pending,l:'Pending',col:'var(--pending)'},{n:c.interview,l:'Interview',col:'var(--interview)'},{n:c.offer,l:'Offers',col:'var(--offer)'},{n:c.rejected,l:'Rejected',col:'var(--rejected)'}];
  document.getElementById('stats').innerHTML=cards.map(x=>`<div class="stat"><div class="num">${x.n}</div><div class="lbl">${x.l}</div><div class="bar" style="background:${x.col}"></div></div>`).join('');
  document.getElementById('footCount').textContent=data.length;
}
function renderHead(){
  document.getElementById('headRow').innerHTML=COLS.map(c=>`<th data-k="${c.k}">${c.label} <span class="arrow">${sortKey===c.k?(sortDir>0?'▲':'▼'):'↕'}</span></th>`).join('')+'<th>Actions</th>';
  document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}render();});
}
function render(){
  renderStats();renderHead();
  const q=document.getElementById('search').value.toLowerCase();
  const sf=document.getElementById('statusFilter').value;
  let rows=data.filter(d=>(!sf||d.status===sf)&&(!q||[d.position,d.company,d.location,d.role,d.industry].join(' ').toLowerCase().includes(q)));
  rows.sort((a,b)=>{let x=(a[sortKey]||'').toLowerCase(),y=(b[sortKey]||'').toLowerCase();return x<y?-sortDir:x>y?sortDir:0;});
  const tb=document.getElementById('tbody');
  if(!rows.length){tb.innerHTML=`<tr><td colspan="12" class="empty">${API_URL?'No applications match.':'Connect your Sheet above to begin.'}</td></tr>`;return;}
  tb.innerHTML=rows.map(d=>`<tr class="row">
    <td><span class="badge" style="background:${STATUS_COLORS[d.status]||'#eee'}">${esc(d.status)}</span></td>
    <td class="pos">${esc(d.position)||'<span class="muted">—</span>'}</td>
    <td class="co">${esc(d.company)||'<span class="muted">—</span>'}</td>
    <td>${esc(d.industry)||'<span class="muted">—</span>'}</td>
    <td>${esc(d.jobtype)||'<span class="muted">—</span>'}</td>
    <td>${esc(d.role)||'<span class="muted">—</span>'}</td>
    <td><span class="pill ${pillClass(d.opt)}">${esc(d.opt)||'—'}</span></td>
    <td><span class="pill ${pillClass(d.h1b)}">${esc(d.h1b)||'—'}</span></td>
    <td>${esc(d.location)||'<span class="muted">—</span>'}</td>
    <td>${fmtDate(d.posted)||'<span class="muted">—</span>'}</td>
    <td>${fmtDate(d.applied)||'<span class="muted">—</span>'}</td>
    <td><div class="rowbtns">
      <button class="iconbtn" onclick="openEdit('${d.id}')" title="Edit">✎</button>
      <button class="iconbtn del" onclick="del('${d.id}')" title="Delete">✕</button>
    </div></td></tr>`).join('');
}

function openEdit(id){
  const d=data.find(x=>x.id===id);if(!d)return;
  editId=id;document.getElementById('modalTitle').textContent='Edit Application';
  FIELDS.forEach(k=>document.getElementById('f_'+k).value=d[k]||'');
  document.getElementById('overlay').classList.add('on');
}
function openAdd(){
  editId=null;document.getElementById('modalTitle').textContent='Add Application';
  FIELDS.forEach(k=>document.getElementById('f_'+k).value='');
  document.getElementById('f_status').value='pending';
  document.getElementById('overlay').classList.add('on');
}
function closeModal(){document.getElementById('overlay').classList.remove('on');}

async function saveModal(){
  if(busy)return;
  const rec={};FIELDS.forEach(k=>rec[k]=document.getElementById('f_'+k).value.trim());
  if(!rec.position&&!rec.company){alert('Add at least a position or company.');return;}
  busy=true;document.getElementById('saveBtn').disabled=true;
  try{
    if(editId){rec.id=editId;await api('update',{record:rec});}
    else{await api('add',{record:rec});}
    closeModal();showStatus('Saved. Refreshing…','ok');
    await loadData();
  }catch(err){showStatus('Save failed: '+err.message,'err');}
  finally{busy=false;document.getElementById('saveBtn').disabled=false;}
}
async function del(id){
  const d=data.find(x=>x.id===id);if(!d)return;
  if(!confirm(`Delete "${d.position||d.company}"?`))return;
  showStatus('Deleting…','ok');
  try{await api('delete',{id});await loadData();}
  catch(err){showStatus('Delete failed: '+err.message,'err');}
}
function exportCSV(){
  const head=COLS.map(c=>c.label).join(',');
  const lines=data.map(d=>COLS.map(c=>`"${(d[c.k]||'').replace(/"/g,'""')}"`).join(','));
  const blob=new Blob([head+'\n'+lines.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='job-applications.csv';a.click();
}

document.getElementById('addBtn').onclick=openAdd;
document.getElementById('cancelBtn').onclick=closeModal;
document.getElementById('saveBtn').onclick=saveModal;
document.getElementById('exportBtn').onclick=exportCSV;
document.getElementById('refreshBtn').onclick=loadData;
document.getElementById('search').oninput=render;
document.getElementById('statusFilter').onchange=render;
document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal();};
document.getElementById('urlSave').onclick=()=>{
  const v=document.getElementById('urlInput').value.trim();
  if(!v){alert('Paste the Web App URL first.');return;}
  API_URL=v;localStorage.setItem(URLKEY,v);loadData();
};
window.openEdit=openEdit;window.del=del;
loadData();
</script>
</body>
</html>
